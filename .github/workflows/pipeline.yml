name: Pipeline Fatec

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    name: Testes automatizados
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar as dependências
        run: pip install -r requirements.txt

      - name: Rodar os testes
        run: python -m pytest -v

  codeql:
    name: CodeQL (análise do código)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar o CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none

      - name: Analisar o código
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
          output: sarif-results

      - name: Falhar se o CodeQL achou problemas
        run: |
          total=$(jq -s '[.[].runs[] | (.results // [])[]] | length' sarif-results/*.sarif)
          echo "Problemas encontrados pelo CodeQL: $total"
          if [ "$total" -gt 0 ]; then exit 1; fi
    segredos:
      name: Busca de segredos
      runs-on: ubuntu-latest
      steps:
       - name: Baixar o código
         uses: actions/checkout@v7

       - name: Instalar o Python
         uses: actions/setup-python@v4
         with:
          python-version: "3.12"

       - name: Instalar o detect-secrets
         run: pip install detect-secrets

       - name: Procurar segredos no código
         run: |
          detect-secrets scan --all-files --exclude-files '(^|/)\.git/' > "$RUNNER_TEMP/segredos.json"
          total=$(jq '[.results[][]] | length' "$RUNNER_TEMP/segredos.json")
          echo "Segredos encontrados: $total"
          jq -r '.results | to_entries[] | .key as $arquivo | .value[] | "\($arquivo) linha \(.line_number): \(.type)"' "$RUNNER_TEMP/segredos.json"
          if [ "$total" -gt 0 ]; then exit 1; fi

  dependencias:
    name: Revisão de dependências
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Verificar dependências
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  staging:
    name: Deploy em staging
    runs-on: ubuntu-latest
    needs: [testes, codeql, segredos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - name: Registrar deploy
        run: |
          echo "Iniciando deploy no ambiente staging"
          echo "Ambiente: ${{ vars.APP_ENV }}"
          echo "URL: ${{ vars.STAGING_URL }}"
          echo "Deploy de demonstração concluído!"